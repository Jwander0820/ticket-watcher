app:
  timezone: Asia/Taipei
  database_path: data/watcher.db
  retention_days: 30

polling:
  normal_interval_seconds: [300, 900]
  active_interval_seconds: [60, 180]
  active_window_seconds: 1800
  exit_active_after_no_available_checks: 2

http:
  platform_concurrency: 1
  min_request_gap_seconds: 5
  timeout_seconds: 20
  backoff_seconds: [900, 1800, 3600]

notifications:
  webhook_url_env: DISCORD_WEBHOOK_URL
  system_alerts_enabled: true
  worker_alerts_enabled: true  # UI 監控意外中止／穩定恢復通知
  worker_alert_channel_id: default  # 可選 UI 新增的專用頻道
  delivery_ttl_seconds: 600
  retry_delays_seconds: [10, 30, 60, 120, 300]

# activity 網址監控外頁場次；order 網址監控內頁票區／票種。
# 填入真實網址後改 enabled: true。範例預設不啟動監控。
channels: []  # 可透過本機 UI 新增；Webhook 存於資料庫旁的私有 JSON，不填在這裡。
targets:
  - id: my-event
    name: 我的監控活動
    platform: ticketplus
    url: https://ticketplus.com.tw/activity/e000000001
    enabled: false
    channel_id: default  # 優先用 UI 預設 Webhook，否則沿用 DISCORD_WEBHOOK_URL
    source: auto
    session_ids: []
    item_ids: []  # order 網址可篩選 a000... 票區或 p000... 票種；activity 不接受
    stop_at: null  # 例如 '2026-11-29T23:00:00+08:00'
