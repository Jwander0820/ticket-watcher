name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  publish:
    needs: python
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Jwander0820/ticket-watcher'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: ghcr.io/jwander0820/ticket-watcher:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy-vps.sh
          bash -n scripts/install-vps-deploy.sh
          bash -n scripts/install-vps-warp.sh
      - name: Build and smoke test Linux amd64 image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --network none "$IMAGE" capabilities --json
      - name: Verify deployment migration in the built image
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated migration and rollback smoke
        env:
          TICKET_WATCHER_DEPLOY_TEST_IMAGE: ${{ env.IMAGE }}
        run: |
          python -m pip install '.[dev]'
          pytest -q tests/test_deploy_container.py
      - name: Publish tested image
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          digest=${digest#*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
  deploy:
    needs: publish
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ticket-watcher-production
      cancel-in-progress: false
    steps:
      - name: Update VPS through restricted SSH entry
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}" "${VPS_PORT:?Missing VPS_PORT}"
          : "${VPS_USER:?Missing VPS_USER}" "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          fail() { printf '::error::%s\n' "$1" >&2; exit 1; }
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || \
            fail 'VPS_HOST must be a hostname or IP only, without ssh, URL, @, quotes or whitespace.'
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || \
            fail 'VPS_PORT must contain only the SSH port number, for example 22.'
          (( 10#$VPS_PORT > 0 && 10#$VPS_PORT <= 65535 )) || \
            fail 'VPS_PORT must be between 1 and 65535.'
          [[ "$VPS_USER" == ubuntu ]] || \
            fail 'VPS_USER must be ubuntu, matching the restricted deployment installer.'
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || \
            fail 'IMAGE_DIGEST from the publish job is invalid.'
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/ticket-watcher-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -F /dev/null -T -i "$ssh_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "deploy $GITHUB_RUN_NUMBER $GITHUB_SHA $IMAGE_DIGEST"
