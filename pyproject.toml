[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-watcher"
version = "0.1.1"
description = "Reusable TicketPlus availability queries and release monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "PyYAML>=6.0,<7", "cryptography>=44,<49", "aiohttp>=3.12,<4", "tzdata>=2025.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.17", "build>=1,<2"]

[project.scripts]
ticket-watcher = "ticket_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticket_watcher = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.ico", "static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
