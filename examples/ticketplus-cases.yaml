# 實測案例，預設全部關閉。只想監控外頁時啟用 yuuri-outer；
# 如需混用內頁票區訊號，可一併啟用下方 10/9、10/10。
# 內頁 URL 由公開場次資料取得，不需要手動先點入網站。
app:
  timezone: Asia/Taipei
  database_path: ../data/watcher.db

targets:
