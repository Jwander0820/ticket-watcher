services:
  ticket-watcher:
    build: .
    restart: unless-stopped
    init: true
    cpus: ${TICKET_WATCHER_CPUS:-0.50}
    mem_limit: ${TICKET_WATCHER_MEMORY:-256m}
    pids_limit: ${TICKET_WATCHER_PIDS:-64}
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - watcher-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ticket-watcher", "--config", "/app/config.yaml", "health", "--json"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

volumes:
  watcher-data:
